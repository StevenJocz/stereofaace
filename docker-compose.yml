# StereoFace — producción en un solo servidor (Ubuntu + Docker Compose).
# Sin ejecutar en desarrollo (no había Docker): validar según DEPLOY.md.
# Variables: archivo .env junto a este (copiar de .env.production.example).
name: stereoface

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL. NO publica puertos: solo es alcanzable desde la red interna de Compose.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stereoface}
      POSTGRES_USER: ${POSTGRES_USER:-stereoface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Tarea de una sola ejecución: migraciones + datos base + primer superadministrador (si procede).
  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?define NEXT_PUBLIC_SITE_URL}
    image: stereoface-web:latest
    command: ["node", "migrate.mjs"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stereoface}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stereoface}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADD_USER_EMAIL: ${ADD_USER_EMAIL:-}
      ADD_USER_PASSWORD: ${ADD_USER_PASSWORD:-}
      ADD_USER_NAME: ${ADD_USER_NAME:-}
      ADD_USER_ROLE: ${ADD_USER_ROLE:-editor}
      DB_POOL_MAX: "2"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  web:
    image: stereoface-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-stereoface}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stereoface}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RADIO_EMBED_HOSTS: ${RADIO_EMBED_HOSTS:-}
      MEDIA_ROOT: /data/media
      # Cámara en cabina (opcional; ver DEPLOY.md, sección «Cámara en cabina»). Vacías = el módulo avisa que falta configurarlo.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      VIDEO_SECRET_KEY: ${VIDEO_SECRET_KEY:-}
      VIDEO_RELAY_URL: ${VIDEO_RELAY_URL:-http://video-relay:8080}
      VIDEO_RELAY_TOKEN: ${VIDEO_RELAY_TOKEN:-}
      VIDEO_WHIP_URL: ${VIDEO_WHIP_URL:-http://mediamtx:8889}
    volumes:
      # Fotografías editoriales: no se pierden al recrear o actualizar el contenedor web.
      - stereoface_media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sin `ports`: solo Nginx lo alcanza. El healthcheck viene del Dockerfile (/api/health).
    expose:
      - "3000"
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # La imagen sustituye ${DOMAIN} en *.template y lo escribe en /etc/nginx/conf.d
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/proxy_params.inc:/etc/nginx/conf.d/proxy_params.inc:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  # Solo para obtener/renovar certificados (ver infra/scripts/init-tls.sh y DEPLOY.md).
  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot

  # Copia diaria de PostgreSQL (pg_dump formato custom) con retención. Copiar ./backups FUERA del servidor.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-stereoface}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-stereoface}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./infra/backup/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # ── Cámara en cabina (perfil «video»: no arranca con un `up` normal) ─────────────────────────────────────────
  # Navegador del locutor ──WHIP (vía web, con credencial de un solo uso)──► mediamtx ──RTSP interno──► video-relay
  # (FFmpeg, video + AAC silenciosa) ──RTMP──► YouTube Live. El sitio muestra el embed oficial de YouTube, siempre mudo.
  mediamtx:
    image: bluenviron/mediamtx:1
    profiles: ["video"]
    restart: unless-stopped
    environment:
      # Dirección con la que el navegador alcanza el puerto de medios (dominio o IP pública). OBLIGATORIA con el perfil video
      # (no se exige con `:?` porque Compose interpola todo el archivo aunque el perfil esté apagado).
      MTX_WEBRTCADDITIONALHOSTS: ${VIDEO_PUBLIC_HOST:-}
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    # Solo el puerto de medios WebRTC es público (UDP preferido, TCP de respaldo). La señalización (8889) y el RTSP (8554)
    # quedan dentro de la red de Compose.
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    logging: *logging

  video-relay:
    build: ./services/video-relay
    profiles: ["video"]
    restart: unless-stopped
    environment:
      RELAY_TOKEN: ${VIDEO_RELAY_TOKEN:-}
    depends_on:
      - mediamtx
    expose:
      - "8080"
    logging: *logging

volumes:
  pgdata:
  stereoface_media:

# Pendiente a propósito (no hay código que lo use todavía): Redis + worker BullMQ (motor de noticias, fase 6)
# y almacenamiento S3/MinIO (módulo de medios). Se añadirán cuando existan.
